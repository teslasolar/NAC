<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANAC Global Chat - P2P WebRTC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-dark: #0a0f1a;
      --bg-panel: #111827;
      --bg-surface: #1f2937;
      --border: #374151;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --accent: #3b82f6;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --cyan: #06b6d4;
      --purple: #8b5cf6;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(180deg, #1e3a5f 0%, #0f2744 100%);
      border-bottom: 2px solid var(--cyan);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header h1 .icon { font-size: 1.5rem; }

    .header .status {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.85rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--yellow);
      animation: pulse 2s infinite;
    }

    .status-dot.connected { background: var(--green); }
    .status-dot.disconnected { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .peer-count {
      background: var(--bg-surface);
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-family: monospace;
      color: var(--cyan);
    }

    /* Main container */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .peer-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .peer-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
    }

    .peer-item:hover { background: var(--bg-surface); }

    .peer-item .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .peer-item.self { border-left: 3px solid var(--cyan); }
    .peer-item.self .avatar { background: var(--cyan); color: #000; }

    .room-info {
      padding: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .room-info code {
      display: block;
      background: var(--bg-dark);
      padding: 0.5rem;
      border-radius: 4px;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      word-break: break-all;
      color: var(--purple);
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }

    .message-author {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .message-time {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .message-text {
      font-size: 0.9rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.system {
      justify-content: center;
    }

    .message.system .message-text {
      background: var(--bg-surface);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Input area */
    .input-area {
      padding: 1rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
    }

    .input-container {
      display: flex;
      gap: 0.75rem;
    }

    .input-container input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .input-container input:focus {
      border-color: var(--accent);
    }

    .input-container button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 0 1.5rem;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .input-container button:hover { background: #2563eb; }
    .input-container button:disabled { background: var(--bg-surface); cursor: not-allowed; }

    /* Join screen */
    .join-screen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .join-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .join-card h2 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    .join-card p {
      color: var(--text-dim);
      margin-bottom: 1.5rem;
    }

    .join-card input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
      text-align: center;
      outline: none;
    }

    .join-card input:focus { border-color: var(--accent); }

    .join-card button {
      width: 100%;
      background: var(--cyan);
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .join-card button:hover { background: #22d3ee; }

    .join-card .tech-note {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .join-card .tech-note span {
      color: var(--purple);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Back link */
    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      z-index: 50;
      display: none;
    }

    .back-link:hover { background: var(--bg-panel); }

    body.chat-active .back-link { display: block; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <!-- Join Screen -->
  <div class="join-screen" id="joinScreen">
    <div class="join-card">
      <h2>🌐 PANAC Chat</h2>
      <p>Join the global P2P chat room for Northampton County citizens</p>
      <input type="text" id="usernameInput" placeholder="Enter your name..." maxlength="20" autocomplete="off">
      <button onclick="joinChat()">Join Room</button>
      <div class="tech-note">
        <span>WebRTC P2P</span> • No server • End-to-end encrypted • Decentralized
      </div>
    </div>
  </div>

  <a href="scada.html" class="back-link">← Back to SCADA</a>

  <!-- Header -->
  <div class="header">
    <h1>
      <span class="icon">🌐</span>
      PANAC Global Chat
    </h1>
    <div class="status">
      <div class="status-item">
        <span class="status-dot" id="connectionStatus"></span>
        <span id="connectionText">Connecting...</span>
      </div>
      <div class="peer-count" id="peerCount">0 peers</div>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">Online Users</div>
      <div class="peer-list" id="peerList"></div>
      <div class="room-info">
        <strong>Room:</strong> PANAC-GLOBAL
        <code id="roomHash">Loading...</code>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="input-container">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
          <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // Trystero - Simple WebRTC rooms
    // Using the nostr strategy for serverless signaling
    import { joinRoom } from 'https://esm.sh/trystero/nostr';

    const ROOM_ID = 'panac-northampton-county-global-2026';
    const APP_ID = 'panac-chat-v1';

    let room = null;
    let myPeerId = null;
    let myUsername = '';
    let peers = new Map(); // peerId -> { username, color }

    const colors = [
      '#ef4444', '#f59e0b', '#22c55e', '#06b6d4', '#3b82f6',
      '#8b5cf6', '#ec4899', '#f97316', '#14b8a6', '#a855f7'
    ];

    function getColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }

    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    }

    // Make joinChat globally accessible
    window.joinChat = function() {
      const input = document.getElementById('usernameInput');
      const name = input.value.trim();
      if (!name) {
        input.style.borderColor = '#ef4444';
        return;
      }
      myUsername = name;
      document.getElementById('joinScreen').style.display = 'none';
      document.body.classList.add('chat-active');
      initChat();
    };

    // Enter key to join
    document.getElementById('usernameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.joinChat();
    });

    function initChat() {
      addSystemMessage('Connecting to P2P network...');

      try {
        room = joinRoom({ appId: APP_ID }, ROOM_ID);
        myPeerId = room.selfId;

        // Display room hash
        document.getElementById('roomHash').textContent =
          `nostr:${ROOM_ID.slice(0, 8)}...${APP_ID.slice(-6)}`;

        // Set up actions
        const [sendChat, onChat] = room.makeAction('chat');
        const [sendJoin, onJoin] = room.makeAction('join');
        const [sendLeave, onLeave] = room.makeAction('leave');

        window.sendChatAction = sendChat;
        window.sendJoinAction = sendJoin;

        // Handle incoming messages
        onChat((data, peerId) => {
          const peer = peers.get(peerId) || { username: 'Unknown', color: '#666' };
          addMessage(peer.username, data.text, peer.color, data.time);
        });

        // Handle peer joins
        onJoin((data, peerId) => {
          peers.set(peerId, { username: data.username, color: getColor(data.username) });
          updatePeerList();
          addSystemMessage(`${data.username} joined the room`);
        });

        // Handle peer leaves
        onLeave((data, peerId) => {
          const peer = peers.get(peerId);
          if (peer) {
            addSystemMessage(`${peer.username} left the room`);
            peers.delete(peerId);
            updatePeerList();
          }
        });

        // Peer connected
        room.onPeerJoin(peerId => {
          updateConnectionStatus(true);
          // Announce ourselves
          sendJoin({ username: myUsername });
        });

        // Peer left
        room.onPeerLeave(peerId => {
          const peer = peers.get(peerId);
          if (peer) {
            addSystemMessage(`${peer.username} disconnected`);
            peers.delete(peerId);
            updatePeerList();
          }
          if (peers.size === 0) {
            updateConnectionStatus(true); // Still connected, just alone
          }
        });

        // Add self to peer list
        peers.set(myPeerId, { username: myUsername + ' (you)', color: getColor(myUsername), self: true });
        updatePeerList();
        updateConnectionStatus(true);

        // Enable input
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('messageInput').focus();

        addSystemMessage('Connected! Waiting for peers...');
        addSystemMessage('Share thomasfrumkin.com/chat.html with others to chat');

      } catch (err) {
        console.error('Connection error:', err);
        addSystemMessage('Connection failed: ' + err.message);
        updateConnectionStatus(false);
      }
    }

    window.sendMessage = function() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !window.sendChatAction) return;

      const time = new Date().toISOString();

      // Send to peers
      window.sendChatAction({ text, time });

      // Show locally
      addMessage(myUsername, text, getColor(myUsername), time, true);

      input.value = '';
      input.focus();
    };

    // Enter to send
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') window.sendMessage();
    });

    function addMessage(author, text, color, time, self = false) {
      const messages = document.getElementById('messages');
      const timeStr = new Date(time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <div class="avatar" style="background: ${color}; color: ${self ? '#000' : '#fff'}">
          ${getInitials(author)}
        </div>
        <div class="message-content">
          <div class="message-header">
            <span class="message-author" style="color: ${color}">${escapeHtml(author)}</span>
            <span class="message-time">${timeStr}</span>
          </div>
          <div class="message-text">${escapeHtml(text)}</div>
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message system';
      div.innerHTML = `<div class="message-text">${escapeHtml(text)}</div>`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function updatePeerList() {
      const list = document.getElementById('peerList');
      list.innerHTML = '';

      peers.forEach((peer, id) => {
        const div = document.createElement('div');
        div.className = 'peer-item' + (peer.self ? ' self' : '');
        div.innerHTML = `
          <div class="avatar" style="background: ${peer.color}">${getInitials(peer.username.replace(' (you)', ''))}</div>
          <span>${escapeHtml(peer.username)}</span>
        `;
        list.appendChild(div);
      });

      document.getElementById('peerCount').textContent = `${peers.size} peer${peers.size !== 1 ? 's' : ''}`;
    }

    function updateConnectionStatus(connected) {
      const dot = document.getElementById('connectionStatus');
      const text = document.getElementById('connectionText');

      if (connected) {
        dot.className = 'status-dot connected';
        text.textContent = 'Connected';
      } else {
        dot.className = 'status-dot disconnected';
        text.textContent = 'Disconnected';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Handle page unload
    window.addEventListener('beforeunload', () => {
      if (room && window.sendLeaveAction) {
        window.sendLeaveAction({ username: myUsername });
      }
    });
  </script>
</body>
</html>

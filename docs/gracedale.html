<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1a">
  <title>Gracedale Dashboard - Northampton County</title>
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/udt.css">
  <link rel="stylesheet" href="css/gracedale.css">
</head>
<body>
  <div class="page-header">
    <h1>Gracedale Nursing Home Dashboard</h1>
    <a href="scada.html" class="back-btn">Back to SCADA</a>
  </div>

  <div class="alert-banner" id="alertBanner"></div>
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="main-content">
    <div class="left-column">
      <div class="panel">
        <div class="panel-header">Staffing Analysis</div>
        <div class="panel-content">
          <table class="data-table"><thead><tr>
            <th>Position</th><th>Req</th><th>Cur</th><th>Gap</th><th>Status</th>
          </tr></thead><tbody id="staffingTable"></tbody></table>
          <div class="action-needed" id="actionItems"></div>
        </div>
      </div>
      <div class="charts-row">
        <div class="panel">
          <div class="panel-header">Census Trend</div>
          <div class="panel-content"><div class="chart" id="censusChart"></div></div>
        </div>
        <div class="panel">
          <div class="panel-header">Quality Ratings</div>
          <div class="panel-content" id="qualityScores"></div>
        </div>
      </div>
    </div>
    <div class="right-column">
      <div class="panel">
        <div class="panel-header">Budget Overview</div>
        <div class="panel-content" id="budgetItems"></div>
      </div>
      <div class="panel">
        <div class="panel-header">Recent Events</div>
        <div class="panel-content" id="timeline"></div>
      </div>
      <div class="panel">
        <div class="panel-header">Resources</div>
        <div class="panel-content" id="resources"></div>
      </div>
    </div>
  </div>

  <script src="js/device.js"></script>
  <script src="js/udt-loader.js"></script>
  <script src="data/gracedale.js"></script>
</body>
</html>
